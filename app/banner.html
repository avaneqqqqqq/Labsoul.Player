<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    font: 13px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .banner {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 100%;
    padding: 0 14px 0 12px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(28, 28, 36, .96), rgba(18, 18, 24, .96));
    border: 1px solid rgba(255, 210, 63, .45);
    box-shadow: 0 18px 44px -18px rgba(0, 0, 0, .9);
    color: #f2f2f5;
  }
  .mark {
    width: 34px;
    height: 34px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: #ffd23f;
    color: #17140a;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -.02em;
  }
  .text { min-width: 0; flex: 1; }
  .title { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: #a2a2ad; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; flex: none; }
  button {
    font: inherit;
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, .14);
    background: rgba(255, 255, 255, .06);
    color: #f2f2f5;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover { background: rgba(255, 255, 255, .13); }
  button.primary { background: #ffd23f; border-color: #ffd23f; color: #17140a; font-weight: 600; }
  button.primary:hover { background: #ffdc6b; }
  button:focus-visible { outline: 2px solid #ffd23f; outline-offset: 2px; }
</style>
</head>
<body>
  <div class="banner">
    <div class="mark">ls</div>
    <div class="text">
      <div class="title" id="title">Доступно обновление</div>
      <div class="sub" id="sub">labsoul — новая версия</div>
    </div>
    <div class="actions">
      <button type="button" class="primary" data-action="download">Скачать</button>
      <button type="button" data-action="later">Позже</button>
    </div>
  </div>

<script>
  const bridge = window.labsoulBanner;
  const title = document.getElementById('title');
  const sub = document.getElementById('sub');

  if (bridge && typeof bridge.onState === 'function') {
    bridge.onState((state) => {
      if (!state) return;
      title.textContent = `Доступна версия ${state.version || ''}`.trim();
      sub.textContent = state.current ? `у вас ${state.current} · labsoul` : 'labsoul';
    });
  }

  for (const button of document.querySelectorAll('button[data-action]')) {
    button.addEventListener('click', () => {
      if (bridge && typeof bridge.action === 'function') bridge.action(button.dataset.action);
    });
  }

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && bridge) bridge.action('later');
  });
</script>
</body>
</html>
