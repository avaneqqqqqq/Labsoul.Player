<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: "Segoe UI Variable Text", "Inter", "Segoe UI", system-ui, sans-serif;
    overflow: hidden; user-select: none;
  }
  .banner {
    display: flex; align-items: center; gap: 12px;
    height: 60px; margin: 8px; padding: 0 12px 0 14px;
    border-radius: 16px;
    background: rgba(18, 18, 24, .97);
    border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 18px 44px rgba(0, 0, 0, .55);
    color: #f3f3f6;
    animation: in 180ms ease-out;
  }
  @keyframes in { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .dot {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: conic-gradient(from 200deg, #ffd23f, #ff4d6d 38%, #7a5cff 70%, #ffd23f);
    box-shadow: 0 0 18px rgba(255, 210, 63, .35);
  }
  .text { min-width: 0; flex: 1; line-height: 1.25; }
  .text b { display: block; font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .text span { display: block; font-size: 11.5px; color: #9a9aa5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    border: 1px solid rgba(255, 255, 255, .14); background: transparent; color: #d6d6de;
    font: inherit; font-size: 12px; padding: 7px 12px; border-radius: 9px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(255, 255, 255, .1); color: #fff; }
  .btn.primary {
    background: #ffd23f; color: #14130f; border-color: transparent; font-weight: 650;
  }
  .btn.primary:hover { filter: brightness(1.07); background: #ffd23f; }
  .x {
    border: 0; background: transparent; color: #8b8b96; font-size: 18px; line-height: 1;
    width: 26px; height: 26px; border-radius: 8px; cursor: pointer; padding: 0;
  }
  .x:hover { background: rgba(255, 255, 255, .1); color: #fff; }
</style>
</head>
<body>
  <div class="banner">
    <div class="dot"></div>
    <div class="text">
      <b id="title">Доступно обновление</b>
      <span id="sub">Скачиваем в фоне — можно продолжать слушать</span>
    </div>
    <button class="btn primary" id="restart" hidden>Перезапустить</button>
    <button class="btn" id="later">Позже</button>
    <button class="x" id="close" title="Закрыть">×</button>
  </div>

  <script>
    const title = document.getElementById('title');
    const sub = document.getElementById('sub');
    const restart = document.getElementById('restart');

    window.bannerAPI.onState((state) => {
      title.textContent = state.ready
        ? `Обновление ${state.version} готово`
        : `Доступно обновление ${state.version}`;
      sub.textContent = state.ready
        ? 'Перезапусти приложение, чтобы применить'
        : 'Скачиваем в фоне — можно продолжать слушать';
      restart.hidden = !state.ready;
    });

    restart.addEventListener('click', () => window.bannerAPI.action('restart'));
    document.getElementById('later').addEventListener('click', () => window.bannerAPI.action('later'));
    document.getElementById('close').addEventListener('click', () => window.bannerAPI.action('close'));
  </script>
</body>
</html>
