<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>labsoul — мини-плеер</title>
<style>
  :root {
    --accent: #ffd23f;
    --text: #f2f2f5;
    --dim: #8b8b96;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }

  /* Вся капсула: обложка, текст, кнопки */
  .mini {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 100%;
    padding: 8px 10px;
    border-radius: 14px;
    background: rgba(16, 16, 20, .92);
    border: 1px solid rgba(255, 255, 255, .1);
    backdrop-filter: blur(20px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color: var(--text);
    font: 12px/1.3 "Segoe UI", system-ui, sans-serif;
  }

  .mini__art {
    width: 54px;
    height: 54px;
    border-radius: 9px;
    flex: none;
    background: #1b1b22 center/cover no-repeat;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
  }

  .mini__info {
    flex: 1;
    min-width: 0;
  }

  .mini__title {
    font-weight: 600;
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mini__artist {
    color: var(--dim);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .mini__bar {
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, .14);
    margin-top: 7px;
    overflow: hidden;
  }

  .mini__bar i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 2px;
    background: var(--accent);
    transition: width 200ms linear;
  }

  .mini__btns {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: none;
    -webkit-app-region: no-drag;
  }

  .mini__btn {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: background-color 140ms ease, color 140ms ease;
  }

  .mini__btn:hover { background: rgba(255, 255, 255, .1); color: var(--text); }

  .mini__btn--play {
    width: 34px;
    height: 34px;
    background: var(--accent);
    color: #14140f;
  }

  .mini__btn--play:hover { background: #ffdd66; }

  .mini__btn svg { width: 15px; height: 15px; fill: currentColor; }
  .mini__btn--play svg { width: 17px; height: 17px; }

  /* Блик за капсулой: реагирует на бит */
  .mini::before {
    content: '';
    position: absolute;
    inset: -6px;
    z-index: -1;
    border-radius: 20px;
    background: radial-gradient(60% 80% at 50% 50%,
      color-mix(in srgb, var(--accent) calc(var(--beat, 0) * 45%), transparent), transparent 70%);
    opacity: calc(.25 + var(--beat, 0) * .75);
    transition: opacity 90ms linear;
  }
</style>
</head>
<body>
  <div class="mini">
    <div class="mini__art" id="art"></div>
    <div class="mini__info">
      <div class="mini__title" id="title">Ничего не играет</div>
      <div class="mini__artist" id="artist">Выберите трек в labsoul</div>
      <div class="mini__bar"><i id="bar"></i></div>
    </div>
    <div class="mini__btns">
      <button class="mini__btn" id="prev" title="Предыдущий" aria-label="Предыдущий">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm12 0v14l-9-7z"/></svg>
      </button>
      <button class="mini__btn mini__btn--play" id="toggle" title="Играть" aria-label="Играть">
        <svg viewBox="0 0 24 24" id="toggle-icon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="mini__btn" id="next" title="Следующий" aria-label="Следующий">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM6 5l9 7-9 7z"/></svg>
      </button>
      <button class="mini__btn" id="close" title="Закрыть" aria-label="Закрыть">
        <svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
      </button>
    </div>
  </div>

<script>
  const ui = {
    art: document.getElementById('art'),
    title: document.getElementById('title'),
    artist: document.getElementById('artist'),
    bar: document.getElementById('bar'),
    toggleIcon: document.getElementById('toggle-icon'),
  };

  let playing = false;
  let duration = 0;

  const PLAY = 'M8 5v14l11-7z';
  const PAUSE = 'M7 5h3.5v14H7zm6.5 0H17v14h-3.5z';

  function render(state) {
    ui.title.textContent = state.title || 'Ничего не играет';
    ui.artist.textContent = state.artist || '';
    if (state.cover) ui.art.style.backgroundImage = `url("${state.cover}")`;
    else ui.art.style.backgroundImage = 'none';

    playing = Boolean(state.playing);
    duration = Number(state.duration) || 0;
    const time = Number(state.time) || 0;
    const percent = duration > 0 ? Math.min(100, (time / duration) * 100) : 0;
    ui.bar.style.width = `${percent}%`;

    ui.toggleIcon.innerHTML = `<path d="${playing ? PAUSE : PLAY}"/>`;
    document.getElementById('toggle').title = playing ? 'Пауза' : 'Играть';
  }

  /* Мост к приложению: получаем трек, отправляем команды */
  const bridge = window.desktopOverlay;
  if (bridge) bridge.onState(render);

  function send(action) {
    if (bridge) bridge.send(action);
  }

  document.getElementById('prev').addEventListener('click', () => send('prev'));
  document.getElementById('next').addEventListener('click', () => send('next'));
  document.getElementById('toggle').addEventListener('click', () => send('toggle'));
  document.getElementById('close').addEventListener('click', () => send('close'));
</script>
</body>
</html>
