<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; }
  .icon {
    width: 512px; height: 512px;
    display: grid; place-items: center;
    background: radial-gradient(120% 120% at 20% 0%, #1b1b2b, #08080c 70%);
    border-radius: 112px;
    box-shadow: inset 0 0 0 6px rgba(255, 255, 255, .06);
  }
  .disc {
    width: 300px; height: 300px; border-radius: 50%;
    background: conic-gradient(from 200deg, #ffd23f, #ff4d6d 35%, #7a5cff 65%, #ffd23f);
    display: grid; place-items: center;
    position: relative;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
  }
  .disc::after {
    content: ""; position: absolute; inset: 96px; border-radius: 50%;
    background: #0a0a0f; box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .1);
  }
  .bars { display: flex; gap: 12px; align-items: center; z-index: 2; }
  .bars i { display: block; width: 16px; border-radius: 8px; background: #ffd23f; }
  .bars i:nth-child(1) { height: 34px; }
  .bars i:nth-child(2) { height: 62px; background: #fff; }
  .bars i:nth-child(3) { height: 46px; }
  .bars i:nth-child(4) { height: 78px; background: #fff; }
  .bars i:nth-child(5) { height: 28px; }
</style>
</head>
<body>
  <div class="icon">
    <div class="disc"><div class="bars"><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>
</body>
</html>
