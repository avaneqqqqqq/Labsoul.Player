name: build

# Только сборка и артефакты. Публикацию релиза делает НЕ CI, а подписанный
# локальный пайплайн (npm run pack → tools\sign-release.ps1 → загрузка в релиз):
# иначе workflow по тегу перезаписывает подписанный установщик неподписанным.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Тесты (ядро, вход, поток, мок Яндекса)
        run: npm test

      - name: Зависимости приложения
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Сборка установщика
        working-directory: app
        run: npm run dist -- --publish never

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: labsoul-installer
          path: |
            app/dist/*-setup.exe
            app/dist/latest.yml
            app/dist/*.blockmap
          if-no-files-found: error
